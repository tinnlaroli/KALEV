<div class="catalogo-usuarios">
  <h2>Catálogo de Usuarios</h2>

  <button class="btn btn-primary" (click)="openCreateModal()">Agregar Usuario</button>

  <table *ngIf="users.length > 0" class="user-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.nombre_usuario }} {{ user.ap_paterno }} {{ user.ap_materno }}</td>
        <td>{{ user.correo }}</td>
        <td>{{ user.telefono }}</td>
        <td>
          <ng-container [ngSwitch]="user.id_rol">
            <span *ngSwitchCase="1">Docente</span>
            <span *ngSwitchCase="2">Director</span>
            <span *ngSwitchCase="3">Tutor</span>
            <span *ngSwitchDefault>Superadmin</span>
          </ng-container>
        </td>
        <td>
          <button class="btn btn-secondary" (click)="editUser(user.id_usuario!)">Editar</button>
          <button class="btn btn-danger" (click)="deleteUser(user.id_usuario!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="users.length === 0" class="empty-msg">No hay usuarios disponibles.</div>
</div>

<!-- ALERT BONITO -->
<div *ngIf="toastMessage" class="toast" [ngClass]="toastType">
  {{ toastMessage }}
</div>

<!-- MODAL CREAR USUARIO -->
<div *ngIf="isCreateModalOpen" class="modal">
  <div class="modal-content">
    <h3>Crear Usuario</h3>
    <form (ngSubmit)="createUser()" #createForm="ngForm">
      <input [(ngModel)]="newUser.nombre_usuario" name="nombre" placeholder="Nombre" required />
      <input [(ngModel)]="newUser.ap_paterno" name="apPaterno" placeholder="Apellido Paterno" required />
      <input [(ngModel)]="newUser.ap_materno" name="apMaterno" placeholder="Apellido Materno" required />
      <input [(ngModel)]="newUser.correo" name="correo" type="email" placeholder="Correo" required email />
      <input [(ngModel)]="newUser.telefono" name="telefono" placeholder="Teléfono" required />
      <input [(ngModel)]="newUser.contrasenia" name="password" type="password" placeholder="Contraseña" required minlength="6" />
      
      <select [(ngModel)]="newUser.id_rol" name="rol" required>
        <option *ngIf="rol_id === 4 || rol_id === 2" [value]="1">Docente</option>
        <option *ngIf="rol_id === 4 || rol_id === 2 || rol_id === 1" [value]="3">Tutor</option>
        <option *ngIf="rol_id === 4" [value]="2">Director</option>
        <option *ngIf="rol_id === 4" [value]="4">Superadmin</option>
      </select>

      <div class="modal-actions">
        <button type="submit" [disabled]="!createForm.valid">Crear</button>
        <button type="button" (click)="closeCreateModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL EDITAR USUARIO -->
<div *ngIf="isEditModalOpen" class="modal">
  <div class="modal-content">
    <h3>Editar Usuario</h3>
    <form (ngSubmit)="updateUser()" #editForm="ngForm">
      <input [(ngModel)]="selectedUser.nombre_usuario" name="editName" placeholder="Nombre" required />
      <input [(ngModel)]="selectedUser.ap_paterno" name="editApPaterno" placeholder="Apellido Paterno" required />
      <input [(ngModel)]="selectedUser.ap_materno" name="editApMaterno" placeholder="Apellido Materno" required />
      <input [(ngModel)]="selectedUser.correo" name="editEmail" type="email" placeholder="Correo" required />
      <input [(ngModel)]="selectedUser.telefono" name="editTelefono" placeholder="Teléfono" required />

      <select [(ngModel)]="selectedUser.id_rol" name="editRol" required>
        <option *ngIf="rol_id === 4 || rol_id === 2" [value]="1">Docente</option>
        <option *ngIf="rol_id === 4 || rol_id === 2 || rol_id === 1" [value]="3">Tutor</option>
        <option *ngIf="rol_id === 4" [value]="2">Director</option>
        <option *ngIf="rol_id === 4" [value]="4">Superadmin</option>
      </select>

      <div class="modal-actions">
        <button type="submit" [disabled]="!editForm.valid">Actualizar</button>
        <button type="button" (click)="closeEditModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
