<div class="student-list-container">
  <h1>Lista de Estudiantes</h1>

  <div *ngIf="students.length > 0; else noData">
    <table class="student-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Grupo</th>
          <th>Ver Perfil</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of students">
          <td>{{ s.nombre }} {{ s.apellido_paterno }}</td>
          <td>{{ s.correo }}</td>
          <td>{{ s.grupo_nombre || 'Sin grupo' }}</td>
          <td>
            <button [routerLink]="['/students', s.id]">Ver</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noData>
    <p>No hay estudiantes registrados.</p>
  </ng-template>
</div>
