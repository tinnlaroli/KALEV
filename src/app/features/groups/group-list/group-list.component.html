<div class="catalogo-grupos">
  <h2>Catálogo de Grupos</h2>

  <app-toast [message]="toastMessage" [type]="toastType"></app-toast>

  <button class="btn btn-primary" (click)="openCreateModal()">Agregar Grupo</button>

  <table *ngIf="groups.length > 0" class="group-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Grado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let group of groups">
        <td>{{ group.nombre_grupo }}</td>
        <td>{{ group.grado }}</td>
        <td>
          <button class="btn btn-secondary" (click)="editGroup(group)">Editar</button>
          <button class="btn btn-danger" (click)="deleteGroup(group.id_grupo!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="groups.length === 0" class="empty-msg">No hay grupos disponibles.</div>
</div>

<!-- Modal Crear -->
<div *ngIf="isCreateModalOpen" class="modal">
  <div class="modal-content">
    <h3>Crear Grupo</h3>
    <form (ngSubmit)="createGroup()" #createForm="ngForm">
      <input [(ngModel)]="newGroup.nombre_grupo" name="nombre" placeholder="Nombre del Grupo" required />
      <input [(ngModel)]="newGroup.grado" name="grado" placeholder="Grado" required />

      <div class="modal-actions">
        <button type="submit" [disabled]="!createForm.valid">Crear</button>
        <button type="button" (click)="closeCreateModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Editar -->
<div *ngIf="isEditModalOpen" class="modal">
  <div class="modal-content">
    <h3>Editar Grupo</h3>
    <form (ngSubmit)="updateGroup()" #editForm="ngForm">
      <input [(ngModel)]="selectedGroup.nombre_grupo" name="editNombre" placeholder="Nombre del Grupo" required />
      <input [(ngModel)]="selectedGroup.grado" name="editGrado" placeholder="Grado" required />

      <div class="modal-actions">
        <button type="submit" [disabled]="!editForm.valid">Actualizar</button>
        <button type="button" (click)="closeEditModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
