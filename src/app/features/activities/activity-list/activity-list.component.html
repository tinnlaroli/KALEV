<app-side-nav>
<div class="container">
  <h2>Lista de Actividades</h2>
  <app-toast [message]="toastMessage" [type]="toastType"></app-toast>

  <button class="btn btn-primary" (click)="openCreateModal()">Crear Actividad</button>

  <table *ngIf="actividades.length > 0" class="activity-table">
    <thead>
      <tr>
        <th>Nombre de la Actividad</th>
        <th>Descripción</th>
        <th>Fecha de Inicio</th>
        <th>Fecha de Fin</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let activity of actividades">
        <td>{{ activity.nombre_actividad }}</td>
        <td>{{ activity.descripcion }}</td>
        <td>{{ activity.fecha_inicio | date }}</td>
        <td>{{ activity.fecha_fin | date }}</td>
        <td>
          <button class="btn btn-secondary" (click)="editActivity(activity)">Editar</button>
          <button class="btn btn-danger" (click)="deleteActivity(activity.id_actividad)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="actividades.length === 0" class="empty-msg">No hay actividades disponibles.</div>
</div>

<!-- Modal Crear -->
<div *ngIf="isCreateModalOpen" class="modal">
  <div class="modal-content">
    <h3>Crear Actividad</h3>
    <form (ngSubmit)="createActivity()" #createForm="ngForm">
      <input [(ngModel)]="newActivity.nombre_actividad" name="nombre_actividad" placeholder="Nombre de la actividad" required />
      <input [(ngModel)]="newActivity.descripcion" name="descripcion" placeholder="Descripción" required />
      <input [(ngModel)]="newActivity.fecha_inicio" name="fecha_inicio" type="date" placeholder="Fecha de inicio" required />
      <input [(ngModel)]="newActivity.fecha_fin" name="fecha_fin" type="date" placeholder="Fecha de fin" required />

      <div class="modal-actions">
        <button type="submit" [disabled]="!createForm.valid">Crear</button>
        <button type="button" (click)="closeCreateModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
</app-side-nav>
