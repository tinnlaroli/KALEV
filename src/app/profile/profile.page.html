<!-- Cabecera de la página -->
<ion-header>
  <!-- Barra de herramientas en la parte superior -->
  <ion-toolbar color="primary"> <!-- Se aplica el color "primary" al toolbar -->
    <ion-title>PERFIL</ion-title> <!-- Título de la página: "PERFIL" -->
  </ion-toolbar>
</ion-header>

<!-- Contenido principal de la página -->
<ion-content>
  <!-- Contenedor de información del estudiante -->
  <div class="content-wrapper">
    <!-- Tarjeta que muestra la información del estudiante -->
    <ion-card class="profile-card">
      <ion-card-content class="center-content">
        <!-- Avatar del estudiante -->
        <ion-avatar>
          <img src="assets/alumno.png" alt="Foto del estudiante"> <!-- Imagen de avatar del estudiante -->
        </ion-avatar>
        <!-- Nombre del estudiante -->
        <h2 class="student-name">Nombre del Estudiante</h2>
        <!-- Información sobre el grado del estudiante -->
        <p class="student-info">Grado: 5</p>
        <!-- Información sobre la clase del estudiante -->
        <p class="student-info">Clase: Matemáticas</p>
        <!-- Mensaje si los datos del estudiante no están disponibles -->
        <p class="no-data">Datos no disponibles</p>
        <!-- Mensaje motivacional -->
        <p class="status-update">¡Sigue aprendiendo!</p>
      </ion-card-content>
    </ion-card>

    <!-- Gráfico de araña (Radar Chart) -->
    <div class="chart-container">
      <!-- Contenedor donde se dibuja el gráfico -->
      <canvas id="spiderChart"></canvas>
    </div>
  </div>
</ion-content>

<!-- Barra de navegación inferior -->
<ion-footer>
  <!-- Barra de herramientas en la parte inferior -->
  <ion-toolbar class="footer-toolbar">
    <!-- Contenedor de botones en la barra de navegación -->
    <ion-buttons class="footer-buttons">
      <!-- Botón de navegación a la página de cursos -->
      <ion-button class="footer-button" [routerLink]="['/courses']">
        <ion-icon name="book-outline"></ion-icon> <!-- Icono de libro -->
        <ion-label>Cursos</ion-label> <!-- Etiqueta que dice "Cursos" -->
      </ion-button>

      <!-- Botón de navegación a la página de perfil -->
      <ion-button class="footer-button" [routerLink]="['/profile']">
        <ion-icon name="person-outline"></ion-icon> <!-- Icono de persona -->
        <ion-label>Perfil</ion-label> <!-- Etiqueta que dice "Perfil" -->
      </ion-button>

      <!-- Botón de navegación a la tienda -->
      <ion-button class="footer-button" [routerLink]="['/tienda']">
        <ion-icon name="cart"></ion-icon> <!-- Icono de carrito de compras -->
        <ion-label>Tienda</ion-label> <!-- Etiqueta que dice "Tienda" -->
      </ion-button>

      <!-- Botón de navegación a la configuración -->
      <ion-button class="footer-button" [routerLink]="['/settings-alumno']">
        <ion-icon name="settings-outline"></ion-icon> <!-- Icono de configuración -->
        <ion-label>Configuración</ion-label> <!-- Etiqueta que dice "Configuración" -->
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
