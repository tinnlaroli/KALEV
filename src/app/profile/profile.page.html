<ion-header>
  <ion-toolbar color="primary">
    <ion-title>PERFIL</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-wrapper">
    <ion-card class="profile-card">
      <ion-card-content class="center-content">
        <ion-avatar>
          <img [src]="estudiante?.foto || 'assets/alumno.png'" alt="Foto del estudiante">
        </ion-avatar>

        <h2 class="student-name" style="padding-top: 20px;">
          {{ cargando ? 'Cargando...' : getNombreCompleto() }}
        </h2>

        <div *ngIf="!cargando">
          <p class="student-info" *ngIf="estudiante?.correo">
            Correo: {{ estudiante.correo }}
          </p>
          <p class="student-info" *ngIf="estudiante?.grupo?.nombre_grupo">
            Grupo: {{ estudiante.grupo.nombre_grupo }}
          </p>
          <p class="student-info" *ngIf="estudiante?.juego?.nombre_juego">
            Juego: {{ estudiante.juego.nombre_juego }}
          </p>

          <p class="no-data" *ngIf="!estudiante">
            No se pudieron cargar los datos del estudiante
          </p>
        </div>

        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
      </ion-card-content>
    </ion-card>

    <!-- Sección del gráfico -->
    <ion-card class="chart-card">
      <ion-card-header>
        <ion-card-title>Mis Habilidades</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="chart-container">
          <canvas #spiderChart></canvas>
        </div>
        <p class="status-update">¡Sigue mejorando tus habilidades!</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
