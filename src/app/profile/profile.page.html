<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando perfil...</p>
  </div>

  <ion-card *ngIf="!isLoading && estudiante">
    <ion-card-header>
      <ion-card-title>
        {{ estudiante.nombre }} {{ estudiante.ap_paterno }} {{ estudiante.ap_materno }}
      </ion-card-title>
      <ion-card-subtitle>Estudiante - {{ estudiante.grado }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label>Correo electrónico</ion-label>
          <ion-text>{{ estudiante.correo }}</ion-text>
        </ion-item>


        <ion-item>
          <ion-icon name="school-outline" slot="start"></ion-icon>
          <ion-label>Grado</ion-label>
          
          <ion-text>{{ estudiante.grado }}</ion-text>
        </ion-item>

        <ion-item>
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Grupo</ion-label>
          <ion-text>{{ estudiante.nombre_grupo }}</ion-text>
        </ion-item>

      
      </ion-list>
    </ion-card-content>
  </ion-card>

  <div *ngIf="!isLoading && !estudiante" class="ion-text-center ion-padding">
    <ion-icon name="warning-outline" size="large"></ion-icon>
    <p>No se encontraron datos del estudiante</p>
  </div>
</ion-content>
