<!-- Encabezado de la página -->
<ion-header>
  <!-- Barra de herramientas con color primario -->
  <ion-toolbar color="primary">
    <!-- Título que aparece en la barra de herramientas -->
    <ion-title>KALEV</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Contenido principal de la página -->
<ion-content>
  <!-- Contenedor para organizar el contenido -->
  <div class="content-wrapper">
    <!-- Título principal de la página -->
    <h1 class="title">🌟 Mis Aprendizajes 🌟</h1>

    <!-- Lista de actividades -->
    <ion-list class="activity-list">
      <!-- Recorre el arreglo 'activities' y genera un ítem por cada actividad -->
        <!-- Resalta la tarjeta al pasar el ratón sobre ella -->
         <!-- Elimina el resalte cuando el ratón deja de estar sobre la tarjeta -->
      <ion-item *ngFor="let activity of activities" class="activity-card" (mouseover)="highlightCard($event)" (mouseleave)="removeHighlight($event)">
        <!-- Thumbnail para mostrar el ícono de la actividad, con clase 'rounded-thumbnail' para redondear los bordes -->
        <ion-thumbnail slot="start" class="rounded-thumbnail">
          <!-- Imagen de la actividad, su fuente se establece con el valor de 'activity.icon' -->
          <img [src]="activity.icon" alt="Icono de actividad" />
        </ion-thumbnail>
        <!-- Etiquetas de texto con la información de la actividad -->
        <ion-label>
          <!-- Nombre de la actividad -->
          <h2>{{ activity.name }}</h2>
          <!-- Tipo de la actividad -->
          <p><strong>Tipo:</strong> {{ activity.type }}</p>
          <!-- Fecha de inicio de la actividad -->
          <p><strong>Inicio:</strong> {{ activity.startDate }}</p>
          <!-- Fecha de finalización de la actividad -->
          <p><strong>Fin:</strong> {{ activity.endDate }}</p>
          <!-- Tipo de aprendizaje relacionado con la actividad -->
          <p><strong>Aprendizaje:</strong> {{ activity.learningType}}</p>
          <!-- Nombre del maestro encargado de la actividad -->
          <p><strong>Maestro:</strong> {{ activity.teacher }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>

<!-- Pie de página con barra de herramientas -->
<ion-footer>
  <!-- Barra de herramientas con clase personalizada para el pie de página -->
  <ion-toolbar class="footer-toolbar">
    <!-- Contenedor para los botones de navegación en el pie de página -->
    <ion-buttons class="footer-buttons">
      <!-- Botón para navegar a la página de cursos -->
      <ion-button class="footer-button" [routerLink]="['/courses']">
        <!-- Icono de libro que representa la sección de cursos -->
        <ion-icon name="book-outline"></ion-icon>
        <!-- Etiqueta del botón -->
        <ion-label>Cursos</ion-label>
      </ion-button>

      <!-- Botón para navegar al perfil del usuario -->
      <ion-button class="footer-button" [routerLink]="['/profile']">
        <!-- Icono de persona que representa la sección de perfil -->
        <ion-icon name="person-outline"></ion-icon>
        <!-- Etiqueta del botón -->
        <ion-label>Perfil</ion-label>
      </ion-button>

      <!-- Botón para navegar a la tienda -->
      <ion-button class="footer-button" [routerLink]="['/tienda']">
        <!-- Icono de carrito que representa la tienda -->
        <ion-icon name="cart"></ion-icon>
        <!-- Etiqueta del botón -->
        <ion-label>Tienda</ion-label>
      </ion-button>

      <!-- Botón para navegar a la configuración -->
      <ion-button class="footer-button" [routerLink]="['/settings-alumno']">
        <!-- Icono de configuración -->
        <ion-icon name="settings-outline"></ion-icon>
        <!-- Etiqueta del botón -->
        <ion-label>Configuración</ion-label>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
