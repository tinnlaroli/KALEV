<ion-content class="ion-padding success-background">
  <div class="success-container">
    <div class="success-content">
      <ion-icon
        name="checkmark-circle"
        color="light"
        class="success-icon"
      ></ion-icon>
      <h1 class="ion-text-center" color="light">¡Compra exitosa!</h1>

      <div class="item-card">
        <img
          [src]="itemComprado?.imagen"
          [alt]="itemComprado?.nombre"
          class="item-image"
        />
        <h2 class="ion-text-center">{{ itemComprado?.nombre }}</h2>
        <ion-text color="medium"> </ion-text>
      </div>

      <ion-button
        expand="block"
        color="light"
        (click)="generarReciboPDF()"
        class="action-button"
      >
        <ion-icon name="share" slot="start"></ion-icon>
        Compartir Comprobante
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        color="#f5f5f5"
        (click)="cerrar()"
        class="action-button"
      >
        Cerrar
      </ion-button>
    </div>
  </div>
</ion-content>
