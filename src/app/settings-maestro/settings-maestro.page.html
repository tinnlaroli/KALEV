<!-- Encabezado de la página -->
<ion-header>
  <ion-toolbar color="primary"> <!-- Barra de herramientas con color primario -->
    <ion-title>Configuración</ion-title> <!-- Título de la página -->
  </ion-toolbar>
</ion-header>

<!-- Contenido de la página -->
<ion-content>
  <div class="content-wrapper"> <!-- Contenedor principal para las secciones dentro de la página -->
    
    <!-- Sección: Idioma -->
    <ion-item class="custom-item"> <!-- Elemento de lista para seleccionar el idioma -->
      <ion-thumbnail slot="start" class="icon-container"> <!-- Ícono a la izquierda -->
        <img src="assets/icon/idioma.png" alt="Icono idioma" /> <!-- Imagen que representa el idioma -->
      </ion-thumbnail>
      <ion-label>Idioma</ion-label> <!-- Etiqueta que indica que esta sección es para seleccionar el idioma -->
      <ion-select [(ngModel)]="selectedLanguage"> <!-- Selector para cambiar el idioma -->
        <ion-select-option value="es">Español</ion-select-option> <!-- Opción para Español -->
        <ion-select-option value="en">Inglés</ion-select-option> <!-- Opción para Inglés -->
      </ion-select>
    </ion-item>

    <!-- Sección: Notificaciones -->
    <ion-item class="custom-item"> <!-- Elemento de lista para activar/desactivar notificaciones -->
      <ion-thumbnail slot="start" class="icon-container"> <!-- Ícono a la izquierda -->
        <img src="assets/icon/notificacion.png" alt="Icono notificaciones" /> <!-- Imagen que representa notificaciones -->
      </ion-thumbnail>
      <ion-label>Notificaciones</ion-label> <!-- Etiqueta que indica que esta sección es para controlar las notificaciones -->
      <ion-toggle [(ngModel)]="notificationsEnabled"></ion-toggle> <!-- Toggle para activar/desactivar las notificaciones -->
    </ion-item>

    <!-- Sección: Tema -->
    <ion-item class="custom-item"> <!-- Elemento de lista para seleccionar el tema -->
      <ion-thumbnail slot="start" class="icon-container"> <!-- Ícono a la izquierda -->
        <img src="assets/icon/tema.png" alt="Icono tema" /> <!-- Imagen que representa el tema -->
      </ion-thumbnail>
      <ion-label>Tema</ion-label> <!-- Etiqueta que indica que esta sección es para seleccionar el tema -->
    </ion-item>
    <ion-radio-group [(ngModel)]="theme"> <!-- Grupo de radio botones para seleccionar el tema -->
      <ion-item class="radio-item"> <!-- Opción de tema claro -->
        <ion-radio value="light"></ion-radio> <!-- Radio botón para tema claro -->
        <ion-label>Claro</ion-label> <!-- Etiqueta para el tema claro -->
      </ion-item>
      <ion-item class="radio-item"> <!-- Opción de tema oscuro -->
        <ion-radio value="dark"></ion-radio> <!-- Radio botón para tema oscuro -->
        <ion-label>Oscuro</ion-label> <!-- Etiqueta para el tema oscuro -->
      </ion-item>
    </ion-radio-group>

    <!-- Botón: Guardar cambios -->
    <ion-button expand="full" color="primary" class="custom-button" (click)="saveSettings()"> <!-- Botón para guardar cambios -->
      Guardar cambios
    </ion-button>
  </div>
</ion-content>

<!-- Menú de navegación inferior -->
<ion-footer>
  <ion-tab-bar slot="bottom" color="light"> <!-- Barra de pestañas en la parte inferior de la página -->
    <ion-tab-button tab="grupos" [routerLink]="['/grupos']"> <!-- Pestaña para la vista de grupos -->
      <ion-icon name="people"></ion-icon> <!-- Ícono para la vista de grupos -->
      <ion-label>Grupos</ion-label> <!-- Etiqueta para la vista de grupos -->
    </ion-tab-button>

    <ion-tab-button tab="actividades" [routerLink]="['/actividades']"> <!-- Pestaña para la vista de actividades -->
      <ion-icon name="clipboard"></ion-icon> <!-- Ícono para la vista de actividades -->
      <ion-label>Actividades</ion-label> <!-- Etiqueta para la vista de actividades -->
    </ion-tab-button>

    <!-- Pestaña comentada para calificaciones, si se decide habilitar -->
    <!-- <ion-tab-button tab="calificaciones" [routerLink]="['/calificaciones']">
      <ion-icon name="school"></ion-icon>
      <ion-label>Calificaciones</ion-label>
    </ion-tab-button> -->

    <ion-tab-button tab="settings" [routerLink]="['/settings-maestro']"> <!-- Pestaña para la vista de configuración -->
      <ion-icon name="settings"></ion-icon> <!-- Ícono para la vista de configuración -->
      <ion-label>Configuración</ion-label> <!-- Etiqueta para la vista de configuración -->
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
