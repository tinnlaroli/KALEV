<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

  <ion-card class="custom-card" color="light">
    <ion-card-header>
      <ion-card-title class="custom-title" style="font-weight: bold;">Bienvenido a</ion-card-title>
      <ion-img src="assets/icon/ic_logo.png" alt="Kalev"></ion-img>
    </ion-card-header>

    <ion-card-content>
      <form (submit)="iniciarSesion()">

        <ion-text class="input-title" style="margin-top: 16px;">Correo Electrónico</ion-text>
        <ion-item class="custom-item">
          <ion-input placeholder="email@domain.com" [(ngModel)]="email" name="email" required>
            <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
          </ion-input>
        </ion-item>

        <ion-text class="input-title" style="margin-top: 16px;">Código</ion-text>
        <ion-item class="custom-item">
          <ion-input placeholder="Código" [(ngModel)]="codigo" name="code" required>
            <ion-icon slot="start" name="key-outline" aria-hidden="true"></ion-icon>
          </ion-input>
        </ion-item>

        <ion-button expand="full" type="submit" color="danger" shape="round" style="margin-top: 30px;">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          <ion-spinner *ngIf="cargando"></ion-spinner>
          <span *ngIf="!cargando">Iniciar Sesión</span>
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
