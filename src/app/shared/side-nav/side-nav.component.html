<div class="sidenav-container">
  <!-- Menú Lateral -->
  <div class="sidenav">
    <div class="sidenav-header">
      <h2>Menú</h2>
      <p *ngIf="authService.getUser()">Hola, {{ authService.getUser().nombre_usuario }}</p>
    </div>
    <ul class="nav-list">
      <!-- Todos los usuarios logueados pueden ver el Dashboard -->
      <li>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      </li>

      <!-- Grupos: Superusuario y Director -->
      <li *ngIf="authService.hasRole([4, 2, 1])">
        <a routerLink="/groups" routerLinkActive="active">Grupos</a>
      </li>

      <!-- Alumnos: solo Docente -->
      <li *ngIf="authService.hasRole([4, 2, 1])">
        <a routerLink="/students" routerLinkActive="active">Alumnos</a>
      </li>

      <!-- Actividades: solo Docente -->
      <li *ngIf="authService.hasRole([4, 2, 1])">
        <a routerLink="/activities" routerLinkActive="active">Actividades</a>
      </li>

      <!-- Reportes: Docente y Director -->
      <li *ngIf="authService.hasRole([4, 2, 1])">
        <a routerLink="/reports" routerLinkActive="active">Reportes</a>
      </li>

      <!-- Usuarios -->
      <!-- Superusuario: gestiona directores -->
      <li *ngIf="authService.hasRole([4])">
        <a routerLink="/users" routerLinkActive="active">Gestionar Usuarios</a>
      </li>

      <!-- Director: gestiona docentes -->
      <li *ngIf="authService.hasRole([2])">
        <a routerLink="/users" routerLinkActive="active">Gestionar Docentes</a>
      </li>

      <!-- Docente: gestiona alumnos -->
      <li *ngIf="authService.hasRole([1])">
        <a routerLink="/users" routerLinkActive="active">Gestionar Alumnos</a>
      </li>

      <!-- Cerrar sesión -->
      <li>
        <a (click)="authService.logout()">Cerrar sesión</a>
      </li>
    </ul>
  </div>

  <!-- Contenido Principal -->
  <div class="sidenav-content">
    <ng-content></ng-content>
  </div>
</div>
